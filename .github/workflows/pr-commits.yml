# Lists the PR's commit messages in its description, between the
# commits:start and commits:end markers from the PR template, and updates
# them on every push. It also sets the coverage section, between the
# coverage:start and coverage:end markers, to pending until ci.yml's
# coverage-report job fills it in; doing both in one edit means the two
# workflows never edit the description at the same time. The rest of the
# description is left alone.
name: PR commits

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-commits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-26.04
    # A fork PR's token can't edit the PR.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      # Only GitHub's API: nothing from the PR is checked out or run.
      - run: |
          gh api "repos/$REPO/pulls/$PR/commits?per_page=100" > commits.json
          gh api "repos/$REPO/pulls/$PR" > pr.json
          python3 - <<'EOF'
          import json
          import re

          START, END = "<!-- commits:start -->", "<!-- commits:end -->"
          TRAILER = re.compile(r"^(Co-Authored-By|Signed-off-by):", re.IGNORECASE)

          # Each commit's message in a code block, as written. The fence is
          # longer than any run of backticks in the message, so it can't end
          # the block early.
          # The API lists them oldest first, the order they land on main.
          blocks = ["Oldest first, in the order they land on `main`."]
          commits = json.load(open("commits.json"))
          for number, commit in enumerate(commits, 1):
              lines = commit["commit"]["message"].strip().splitlines()
              message = "\n".join(l for l in lines if not TRAILER.match(l)).strip()
              runs = re.findall(r"`+", message)
              fence = "`" * max([3] + [len(run) + 1 for run in runs])
              # GitHub links a bare commit hash to the commit.
              label = f"**{number} of {len(commits)}** · {commit['sha'][:7]}"
              blocks.append(f"{label}\n\n{fence}text\n{message}\n{fence}")
          commits = START + "\n" + "\n\n".join(blocks) + "\n" + END

          # Replaces a section's text between its markers, or adds the
          # section at the end.
          def replace(body, heading, start, end, text):
              if start in body and end in body:
                  before, _, after = body.partition(start)
                  return before + text + after.partition(end)[2]
              return body.rstrip() + f"\n\n## {heading}\n" + text + "\n"

          old = json.load(open("pr.json"))["body"] or ""
          body = old
          body = replace(body, "Commits", START, END, commits)
          body = replace(body, "Coverage", "<!-- coverage:start -->",
                         "<!-- coverage:end -->",
                         "<!-- coverage:start -->\n"
                         "Pending coverage results…\n"
                         "<!-- coverage:end -->")
          # One newline at the end, so edits don't pile them up.
          body = body.rstrip() + "\n"
          if body != old:
              open("new_body.md", "w").write(body)
          EOF
          if [[ -f new_body.md ]]; then
            gh api -X PATCH "repos/$REPO/pulls/$PR" -F body=@new_body.md > /dev/null
          fi
