# Runs the tests and the format check on every PR. The tests also run on every
# push to main, which keeps a warm cache for new PR branches to start from.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels the run for the push before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.config }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        config: [opt, asan, ubsan, tsan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs Bazel and saves its caches between runs: the Bazel binary,
      # downloaded dependencies, and build outputs, one cache per config.
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ matrix.config }}
          repository-cache: true
      - run: bazel test //... --config=${{ matrix.config }}

  format:
    # main only gets commits from PRs that passed it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
      - run: bazel run //:format.check
