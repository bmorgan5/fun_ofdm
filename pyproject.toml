# The Python tools and hardware tests, which run outside Bazel. uv installs
# Python and these packages, with the versions pinned in uv.lock: `uv sync`.
# Each package is added by the first tool that needs it.
[project]
name = "fun-ofdm-tools"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.uv]
# Scripts and tests, not a package to build and install.
package = false

[tool.ruff]
line-length = 80
# Python files only: ruff also formats the code blocks in Markdown files.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# On top of the defaults (pycodestyle errors and pyflakes): bugbear (B),
# docstrings (D), import sorting (I), pytest style (PT), ruff's own rules
# (RUF), simplifications (SIM) and pyupgrade (UP).
extend-select = ["B", "D", "I", "PT", "RUF", "SIM", "UP"]

[tool.ruff.lint.pydocstyle]
# Google's style, like the rest of the repo.
convention = "google"

[tool.ruff.lint.per-file-ignores]
# A test's name says what it tests, so tests don't need docstrings. Fixtures
# in conftest.py still do: `pytest --fixtures` shows them.
"**/test_*.py" = ["D"]

[tool.ty.environment]
# As pytest's pythonpath, below: tests/ imports the tools it uses.
extra-paths = ["tools/per"]

[tool.ty.terminal]
# Warnings fail the check too, so CI catches them.
error-on-warning = true

[tool.pytest.ini_options]
# By default, the tools' own tests, beside their code in tools/. The tests of
# fun-ofdm itself, in tests/, run the binary and take minutes, so they only
# run when named: `pytest tests`, as CI does in its own job.
testpaths = ["tools"]
# So tests/ can import the tools it uses.
pythonpath = ["tools/per"]
